<!DOCTYPE html>
<html lang="es" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Menú Digital Oficial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    .brand-bg { background-color: var(--primary); }
    .brand-text { color: var(--primary); }
    .brand-border { border-color: var(--primary); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-32">

  <!-- CABECERA DEL RESTAURANTE (PORTADA + PERFIL) -->
  <header class="relative">
    <div class="h-40 w-full overflow-hidden relative">
      <img id="rest-cover" src="" alt="Portada" class="w-full h-full object-cover brightness-50" />
      <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>
      <!-- Botón QR para el negocio / cliente -->
      <button onclick="abrirModalQR()" class="absolute top-3 right-3 bg-slate-900/80 backdrop-blur border border-slate-700 text-white text-xs font-bold px-3 py-1.5 rounded-full flex items-center gap-1.5 shadow-lg">
        <span>📱 QR del Menú</span>
      </button>
    </div>

    <div class="max-w-md mx-auto px-4 -mt-12 relative z-10">
      <div class="flex items-end justify-between gap-3">
        <div id="rest-logo" class="w-20 h-20 rounded-2xl brand-bg border-4 border-slate-950 flex items-center justify-center text-2xl font-extrabold text-white shadow-xl shrink-0"></div>
        <div class="flex-1 pb-1">
          <div class="flex items-center gap-2">
            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Abierto
            </span>
            <span id="rest-schedule" class="text-[11px] text-slate-400 font-medium"></span>
          </div>
          <h1 id="rest-name" class="text-xl font-extrabold text-white leading-tight mt-0.5"></h1>
        </div>
      </div>
      <p id="rest-desc" class="text-xs text-slate-400 mt-2 leading-relaxed"></p>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="max-w-md mx-auto px-4 mt-5 space-y-5">

    <!-- SELECTOR DE SUCURSAL Y MODALIDAD -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-3 shadow-lg">
      <div class="flex items-center justify-between">
        <label class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
          <span>📍 Sucursal más cercana:</span>
        </label>
        <span id="branch-badge" class="text-[10px] text-slate-400 font-semibold"></span>
      </div>
      <select id="branch-select" onchange="actualizarSucursal()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs font-semibold text-white focus:outline-none focus:border-slate-600"></select>

      <!-- Píldoras de Modalidad -->
      <div class="grid grid-cols-3 gap-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs font-bold">
        <button onclick="cambiarModalidad('Delivery')" id="mod-Delivery" class="py-2 rounded-lg brand-bg text-white transition">🛵 Delivery</button>
        <button onclick="cambiarModalidad('Para Llevar')" id="mod-Para Llevar" class="py-2 rounded-lg text-slate-400 hover:text-white transition">🛍️ Retirar</button>
        <button onclick="cambiarModalidad('Reserva en Local')" id="mod-Reserva en Local" class="py-2 rounded-lg text-slate-400 hover:text-white transition">🍽️ Mesa</button>
      </div>
    </section>

    <!-- BUSCADOR Y CATEGORÍAS -->
    <section class="sticky top-0 z-30 bg-slate-950/95 backdrop-blur py-2.5 space-y-2.5 border-b border-slate-900">
      <div class="relative">
        <input id="search-input" oninput="filtrarPlatillos()" type="text" placeholder="🔍 Buscar platillo, bebida o combo..." class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-3.5 pr-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-slate-700" />
      </div>
      <div id="category-tabs" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1"></div>
    </section>

    <!-- CATÁLOGO DE PLATILLOS -->
    <section id="dishes-container" class="space-y-3"></section>

  </main>

  <!-- BARRA FLOTANTE INFERIOR DEL CARRITO -->
  <div id="cart-bar" class="fixed bottom-0 inset-x-0 bg-slate-950/95 backdrop-blur border-t border-slate-800 p-3 z-40 hidden">
    <div class="max-w-md mx-auto">
      <button onclick="abrirModalCheckout()" class="w-full brand-bg text-white font-extrabold text-sm py-3.5 px-4 rounded-2xl shadow-xl flex items-center justify-between active:scale-98 transition">
        <div class="flex items-center gap-2">
          <span id="cart-count-badge" class="bg-black/30 px-2.5 py-0.5 rounded-lg text-xs">0</span>
          <span>Ver mi Pedido</span>
        </div>
        <span id="cart-bar-total" class="text-sm font-extrabold">C$ 0</span>
      </button>
    </div>
  </div>

  <!-- MODAL DE CHECKOUT (DATOS DE ENTREGA Y ENVÍO A WHATSAPP) -->
  <div id="checkout-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-base font-extrabold text-white">📋 Confirmar tu Pedido</h3>
        <button onclick="cerrarModalCheckout()" class="text-slate-400 hover:text-white text-sm font-bold px-2 py-1">✕</button>
      </div>

      <!-- Resumen de items -->
      <div id="checkout-items" class="space-y-2 max-h-44 overflow-y-auto pr-1"></div>

      <!-- Datos del cliente -->
      <div class="space-y-2.5 pt-2 border-t border-slate-800 text-xs">
        <div>
          <label class="block text-slate-400 font-semibold mb-1">👤 Tu Nombre:</label>
          <input id="cust-name" type="text" placeholder="Ej: Carlos Mendoza" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white focus:outline-none" />
        </div>

        <div id="address-box">
          <label class="block text-slate-400 font-semibold mb-1">📍 Dirección exacta y referencia:</label>
          <textarea id="cust-address" rows="2" placeholder="Ej: Barrio San Judas, de donde fue el cine 2c al sur, casa portón negro..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-400 font-semibold mb-1">💳 Forma de Pago:</label>
            <select id="cust-payment" onchange="toggleEfectivoInput()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2.5 text-white focus:outline-none">
              <option value="Efectivo (Córdobas)">💵 Efectivo</option>
              <option value="Transferencia BAC / Lafise / Banpro">🏦 Transferencia</option>
              <option value="Tarjeta / POS">💳 Tarjeta / POS</option>
            </select>
          </div>
          <div id="cash-change-box">
            <label class="block text-slate-400 font-semibold mb-1">💵 ¿Con cuánto pagas?</label>
            <input id="cust-cash" type="text" placeholder="Ej: Con C$ 500 o Exacto" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white focus:outline-none" />
          </div>
        </div>

        <div>
          <label class="block text-slate-400 font-semibold mb-1">📝 Nota adicional o guarniciones:</label>
          <input id="cust-notes" type="text" placeholder="Ej: Con gallo pinto, tajadas y sin cebolla..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white focus:outline-none" />
        </div>
      </div>

      <!-- Total Final -->
      <div class="bg-slate-950 border border-slate-800 rounded-2xl p-3.5 space-y-1 text-xs">
        <div class="flex justify-between text-slate-400">
          <span>Modalidad:</span>
          <span id="summary-modality" class="font-bold text-white">Delivery</span>
        </div>
        <div class="flex justify-between text-slate-400">
          <span>Sucursal que atiende:</span>
          <span id="summary-branch" class="font-bold text-white"></span>
        </div>
        <div class="flex justify-between text-sm font-extrabold text-white pt-1.5 border-t border-slate-800">
          <span>Total a Pagar:</span>
          <span id="checkout-total" class="brand-text">C$ 0</span>
        </div>
      </div>

      <button onclick="enviarPedidoFinalWhatsApp()" class="w-full brand-bg text-white font-extrabold text-sm py-3.5 rounded-2xl shadow-lg active:scale-95 transition flex items-center justify-center gap-2">
        <span>📲 Enviar Pedido por WhatsApp</span>
      </button>
    </div>
  </div>

  <!-- MODAL DE CÓDIGO QR PARA MESAS Y EMPAQUES -->
  <div id="qr-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-xs rounded-3xl p-5 text-center space-y-4">
      <div class="flex items-center justify-between">
        <span class="text-xs font-extrabold uppercase tracking-wider text-slate-400">Código QR Oficial</span>
        <button onclick="cerrarModalQR()" class="text-slate-400 hover:text-white text-sm font-bold">✕</button>
      </div>
      <div class="bg-white p-4 rounded-2xl inline-block mx-auto shadow-lg">
        <img id="qr-image" src="" alt="QR Menú" class="w-44 h-44 mx-auto" />
      </div>
      <div>
        <h4 id="qr-title" class="font-extrabold text-white text-sm"></h4>
        <p class="text-[11px] text-slate-400 mt-1">Escanea con la cámara del celular para abrir el menú directo sin aplicaciones.</p>
      </div>
      <button onclick="cerrarModalQR()" class="w-full bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold py-2.5 rounded-xl">Cerrar</button>
    </div>
  </div>

      }
    };

    let claveTienda = 'saborpersa';
    let tiendaActual = TIENDAS.saborpersa;
    let categoriaActiva = 'Todos';
    let modalidadActiva = 'Delivery';
    let carrito = {};

    function detectarTiendaURL() {
      const url = decodeURIComponent(window.location.href).toLowerCase();
      if (url.includes('amalia')) return 'amalia';
      if (url.includes('asian') || url.includes('wok')) return 'asianwok';
      if (url.includes('lima')) return 'lima';
      if (url.includes('ceviche')) return 'donceviche';
      return 'saborpersa';
    }

    function inicializarTienda() {
      claveTienda = detectarTiendaURL();
      tiendaActual = TIENDAS[claveTienda];
      carrito = {};
      categoriaActiva = 'Todos';

      document.documentElement.style.setProperty('--primary', tiendaActual.primary);
      document.title = `${tiendaActual.nombre} - Menú Digital`;

      document.getElementById('rest-cover').src = tiendaActual.cover;
      document.getElementById('rest-logo').textContent = tiendaActual.iniciales;
      document.getElementById('rest-name').textContent = tiendaActual.nombre;
      document.getElementById('rest-schedule').textContent = `🕒 ${tiendaActual.horario}`;
      document.getElementById('rest-desc').textContent = tiendaActual.descripcion;

      // Sucursales
      const select = document.getElementById('branch-select');
      select.innerHTML = tiendaActual.sucursales.map((s, idx) => `<option value="${idx}">${s.nombre}</option>`).join('');
      document.getElementById('branch-badge').textContent = `${tiendaActual.sucursales.length} disponible(s)`;

      renderizarCategorias();
      filtrarPlatillos();
      actualizarBarraCarrito();
    }

    function renderizarCategorias() {
      const container = document.getElementById('category-tabs');
      container.innerHTML = tiendaActual.categorias.map(cat => {
        const activo = (cat === categoriaActiva);
        return `
          <button onclick="seleccionarCategoria('${cat}')" class="px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition ${activo ? 'brand-bg text-white shadow' : 'bg-slate-900 text-slate-400 border border-slate-800'}">
            ${cat}
          </button>
        `;
      }).join('');
    }

    function seleccionarCategoria(cat) {
      categoriaActiva = cat;
      renderizarCategorias();
      filtrarPlatillos();
    }

    function cambiarModalidad(mod) {
      modalidadActiva = mod;
      ['Delivery', 'Para Llevar', 'Reserva en Local'].forEach(m => {
        const btn = document.getElementById('mod-' + m);
        btn.className = (m === mod)
          ? "py-2 rounded-lg brand-bg text-white transition shadow"
          : "py-2 rounded-lg text-slate-400 hover:text-white transition";
      });
      // Ocultar dirección si no es Delivery
      document.getElementById('address-box').style.display = (mod === 'Delivery') ? 'block' : 'none';
    }

    function filtrarPlatillos() {
      const texto = document.getElementById('search-input').value.toLowerCase().trim();
      const container = document.getElementById('dishes-container');

      const filtrados = tiendaActual.platillos.filter(p => {
        const coincideCat = (categoriaActiva === 'Todos') || (p.cat === categoriaActiva);
        const coincideTexto = p.nombre.toLowerCase().includes(texto) || p.desc.toLowerCase().includes(texto);
        return coincideCat && coincideTexto;
      });

      if (filtrados.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-xs text-slate-500">No se encontraron platillos con esa búsqueda.</div>`;
        return;
      }

      container.innerHTML = filtrados.map(p => {
        const cant = carrito[p.id] || 0;
        return `
          <div class="bg-slate-900 border border-slate-800/90 rounded-2xl p-3 flex gap-3 items-center shadow-md">
            <img src="${p.img}" alt="${p.nombre}" class="w-20 h-20 rounded-xl object-cover shrink-0 bg-slate-800" />
            <div class="flex-1 min-w-0">
              <span class="text-[10px] font-bold text-slate-400 uppercase">${p.cat}</span>
              <h3 class="text-xs font-extrabold text-white leading-snug">${p.nombre}</h3>
              <p class="text-[11px] text-slate-400 line-clamp-2 mt-0.5 leading-relaxed">${p.desc}</p>
              <div class="flex items-center justify-between mt-2">
                <span class="text-xs font-extrabold brand-text">${p.precio > 0 ? 'C$ ' + p.precio : 'Sin costo'}</span>
                <div class="flex items-center gap-2">
                  ${cant > 0 ? `
                    <button onclick="modificarItem(${p.id}, -1)" class="w-7 h-7 rounded-lg bg-slate-800 text-white font-bold text-xs">-</button>
                    <span class="text-xs font-extrabold w-4 text-center">${cant}</span>
                  ` : ''}
                  <button onclick="modificarItem(${p.id}, 1)" class="px-3 h-7 rounded-lg brand-bg text-white font-bold text-xs shadow">
                    ${cant > 0 ? '+' : '+ Agregar'}
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function modificarItem(id, delta) {
      carrito[id] = Math.max(0, (carrito[id] || 0) + delta);
      filtrarPlatillos();
      actualizarBarraCarrito();
    }

    function calcularTotales() {
      let conteo = 0;
      let total = 0;
      tiendaActual.platillos.forEach(p => {
        const c = carrito[p.id] || 0;
        conteo += c;
        total += c * p.precio;
      });
      return { conteo, total };
    }

    function actualizarBarraCarrito() {
      const { conteo, total } = calcularTotales();
      const bar = document.getElementById('cart-bar');
      if (conteo > 0) {
        bar.classList.remove('hidden');
        document.getElementById('cart-count-badge').textContent = `${conteo} item(s)`;
        document.getElementById('cart-bar-total').textContent = `C$ ${total}`;
      } else {
        bar.classList.add('hidden');
      }
    }

    function actualizarSucursal() {}

    function toggleEfectivoInput() {
      const pago = document.getElementById('cust-payment').value;
      document.getElementById('cash-change-box').style.display = pago.includes('Efectivo') ? 'block' : 'none';
    }

    function abrirModalCheckout() {
      const idxSucursal = document.getElementById('branch-select').value;
      const sucursalObj = tiendaActual.sucursales[idxSucursal];
      const { total } = calcularTotales();

      const seleccionados = tiendaActual.platillos.filter(p => (carrito[p.id] || 0) > 0);
      document.getElementById('checkout-items').innerHTML = seleccionados.map(p => `
        <div class="flex items-center justify-between text-xs bg-slate-950 p-2.5 rounded-xl border border-slate-800">
          <div>
            <span class="font-bold text-white">${carrito[p.id]}x ${p.nombre}</span>
            <span class="block text-[10px] text-slate-400">C$ ${p.precio} c/u</span>
          </div>
          <span class="font-extrabold text-white">C$ ${p.precio * carrito[p.id]}</span>
        </div>
      `).join('');

      document.getElementById('summary-modality').textContent = modalidadActiva;
      document.getElementById('summary-branch').textContent = sucursalObj.nombre;
      document.getElementById('checkout-total').textContent = `C$ ${total}`;
      document.getElementById('checkout-modal').classList.remove('hidden');
    }

    function cerrarModalCheckout() {
      document.getElementById('checkout-modal').classList.add('hidden');
    }

    function enviarPedidoFinalWhatsApp() {
      const nombre = document.getElementById('cust-name').value.trim() || "Cliente";
      const direccion = document.getElementById('cust-address').value.trim() || "No especificada";
      const pago = document.getElementById('cust-payment').value;
      const cambio = document.getElementById('cust-cash').value.trim();
      const notas = document.getElementById('cust-notes').value.trim();

      const idxSucursal = document.getElementById('branch-select').value;
      const sucursalObj = tiendaActual.sucursales[idxSucursal];
      const { total } = calcularTotales();

      const seleccionados = tiendaActual.platillos.filter(p => (carrito[p.id] || 0) > 0);
      const lineas = seleccionados.map(p => `• *${carrito[p.id]}x* ${p.nombre} (C$ ${p.precio * carrito[p.id]})`).join('\n');

      let msg = `🧾 *NUEVO PEDIDO - ${tiendaActual.nombre.toUpperCase()}*\n`;
      msg += `━━━━━━━━━━━━━━━━━━━━\n`;
      msg += `👤 *Cliente:* ${nombre}\n`;
      msg += `📍 *Sucursal:* ${sucursalObj.nombre}\n`;
      msg += `🛵 *Modalidad:* ${modalidadActiva}\n`;
      if (modalidadActiva === 'Delivery') {
        msg += `🗺️ *Dirección:* ${direccion}\n`;
      }
      msg += `━━━━━━━━━━━━━━━━━━━━\n`;
      msg += `*DETALLE DEL PEDIDO:*\n${lineas}\n`;
      if (notas) {
        msg += `\n📝 *Notas:* ${notas}\n`;
      }
      msg += `━━━━━━━━━━━━━━━━━━━━\n`;
      msg += `💳 *Pago:* ${pago}\n`;
      if (pago.includes('Efectivo') && cambio) {
        msg += `💵 *Paga con:* ${cambio}\n`;
      }
      msg += `💰 *TOTAL A PAGAR: C$ ${total}*`;

      window.open(`https://wa.me/${sucursalObj.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function abrirModalQR() {
      const urlTienda = window.location.href;
      document.getElementById('qr-title').textContent = tiendaActual.nombre;
      document.getElementById('qr-image').src = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(urlTienda)}`;
      document.getElementById('qr-modal').classList.remove('hidden');
    }

    function cerrarModalQR() {
      document.getElementById('qr-modal').classList.add('hidden');
    }

    inicializarTienda();
  </script>
</body>
</html>
